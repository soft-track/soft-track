services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softtrack}
      POSTGRES_DB: ${POSTGRES_DB:-softtrack}
    volumes:
      - softtrack-db:/var/lib/postgresql/data
    # Not published to the host by default -- only the backend needs to reach
    # it. Uncomment to inspect the database with a local client.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softtrack} -d ${POSTGRES_DB:-softtrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-softtrack}:${POSTGRES_PASSWORD:-softtrack}@db:5432/${POSTGRES_DB:-softtrack}
      # development keeps the convenient defaults. Set ENVIRONMENT to anything
      # else and the app refuses to start unless SECRET_KEY is a real value,
      # because the default below is published in this repository.
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production}
      # Uploaded files. On a volume for the same reason the database is: a
      # rebuilt container must not take everyone's screenshots with it.
      ATTACHMENT_DIR: /data/attachments
      # Notifications reach the in-app inbox with nothing configured. Set
      # SMTP_HOST to also send the batched email digest; blank leaves it off
      # and starts no digest loop. APP_BASE_URL is where the links in that
      # mail point, so it is the frontend's address, not the API's.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # And where GitHub or GitLab reaches the API, for the webhook URLs on a
      # team's Repositories page. The default is right for a laptop and wrong
      # for anywhere a provider has to route to.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-softtrack@localhost}
    volumes:
      - softtrack-files:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # The browser resolves this, so it is the host's published backend
        # port -- not the compose service name.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      # Host port 5173 matches the backend's default cors_origins, so the API
      # accepts requests from this origin without extra configuration.
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  softtrack-db:
  softtrack-files:
