<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef0f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b15" media="(prefers-color-scheme: dark)" />
    <title>SoftTrack</title>

    <!--
      How a link to this instance unfurls, in Slack and everywhere else that
      reads the static HTML. `%APP_BASE_URL%` is substituted at build time
      from APP_BASE_URL -- the same setting the digest emails use, and for the
      same reason: og:image and og:url have to be absolute, and a preview
      pointing at localhost is no preview at all. See vite.config.ts.

      Worth stating the limit: this is a client-rendered app, so an unfurler
      that reads the HTML gets these tags, while a crawler that does not run
      scripts still finds an empty shell behind them. Prerendering is a much
      bigger change and is not this one.
    -->
    <meta
      name="description"
      content="An open-source, self-hostable issue tracker. Teams, projects and cycles, a kanban board with drag-and-drop, and reports built from real issue history."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SoftTrack" />
    <meta property="og:title" content="SoftTrack" />
    <meta
      property="og:description"
      content="An open-source, self-hostable issue tracker. Teams, projects and cycles, a kanban board with drag-and-drop, and reports built from real issue history."
    />
    <meta property="og:url" content="%APP_BASE_URL%/" />
    <meta property="og:image" content="%APP_BASE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The SoftTrack board: issues in Backlog, Todo, In Progress, In Review and Done."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SoftTrack" />
    <meta
      name="twitter:description"
      content="An open-source, self-hostable issue tracker. Teams, projects and cycles, a kanban board with drag-and-drop, and reports built from real issue history."
    />
    <meta name="twitter:image" content="%APP_BASE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The SoftTrack board: issues in Backlog, Todo, In Progress, In Review and Done."
    />
    <script>
      // Stamp the theme before the first paint so a dark-mode user never
      // sees a light flash. Mirrors src/ui/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('softtrack.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
