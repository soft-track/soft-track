name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · black + migrations + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check --diff . --exclude venv

      - name: Exactly one migration head
        # Two branches that each add a migration from the same parent produce
        # two Alembic heads. Nothing fails until a deploy runs `upgrade head`
        # and the app refuses to boot, which is a bad place to find out --
        # so find out here instead.
        env:
          DATABASE_URL: "sqlite://"
        run: |
          heads=$(alembic heads)
          count=$(printf '%s\n' "$heads" | grep -c '(head)' || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count:"
            printf '%s\n' "$heads"
            echo
            echo "Two migrations share a parent, so 'alembic upgrade head'"
            echo "fails and the app cannot boot on a fresh database."
            echo
            echo "If the other migration is not merged yet: rebase onto main"
            echo "and point this branch's migration at the other head by"
            echo "editing its down_revision."
            echo
            echo "If both are already on main: add a merge revision instead,"
            echo "so neither published revision id has to be rewritten --"
            echo "  alembic merge -m 'merge <a> and <b>' <head1> <head2>"
            exit 1
          fi
          printf 'Single head: %s\n' "$heads"

      - name: Run tests with coverage
        # Tests use in-memory SQLite with PRAGMA foreign_keys=ON, so they catch
        # the referential bugs Postgres would catch without needing a service.
        env:
          DATABASE_URL: "sqlite://"
        # --durations=10 names the slowest tests in the log, so the next time
        # this step creeps back towards the ten minutes it took before #169 the
        # culprit is a scroll away rather than a profiling session.
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --durations=10

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Backend coverage'
            echo
            echo '```'
            coverage report | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend · lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"       # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Folders whose text lives in the translation catalog stay that way
      # (#106): literal UI text in them fails here.
      - name: No literal UI text in converted folders
        run: npm run lint:i18n

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api-contract:
    name: API contract · openapi.json is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # backend/openapi.json is the contract Orval generates the typed frontend
      # client from. If a route or schema changes without regenerating it, the
      # client silently drifts out of sync with the API. Fail loudly instead.
      - name: Regenerate the schema and fail on drift
        working-directory: backend
        env:
          DATABASE_URL: "sqlite://"
        run: |
          python export_openapi.py
          if ! git diff --quiet -- openapi.json; then
            echo "::error file=backend/openapi.json::openapi.json is out of date."
            echo "Run 'python export_openapi.py' in backend/, then 'npm run generate:api'"
            echo "in frontend/, and commit both."
            git diff -- openapi.json
            exit 1
          fi
          echo "openapi.json matches the running app."

  docker:
    name: Docker · build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the stack
        run: docker compose build

      # The unit suite runs against SQLite with the app in-process. This runs
      # the real images against real Postgres over HTTP, which is the only
      # place a response-shape change shows up before a user finds it.
      - name: Start the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health >/dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Smoke test the running API
        run: BASE_URL=http://localhost:8000 ./backend/smoke_test.sh

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E · Playwright journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The same images the Docker job builds and smoke-tests: the real
      # backend, the built frontend, and Postgres, driven from a browser.
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health >/dev/null \
              && curl -fs http://localhost:5173 >/dev/null; then
              echo "stack up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the stack did not come up"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      # A failure nobody can see is a failure nobody fixes: the trace has
      # every action, the DOM before and after each, and the network.
      # Open one with `npx playwright show-trace <trace.zip>`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down -v
