[pytest]
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # The one warning that is not ours to fix by editing a file: Starlette
    # wants its TestClient moved to httpx2, which is a dependency migration,
    # not a rename (issue #57 decided to defer it). Ignored this narrowly so
    # the summary stays empty and the next warning to appear is read on the
    # day it appears instead of scrolling past with old news.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
